<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>OG card · В&Ю</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Italiana&family=Inter:wght@300;400;500&display=swap">

  <style>
    /* ============================================================
       OG card v2 — generic share preview, 1200×630.
       Matches the site's cream theme (theme.css [data-theme="cream"]).
       New 2026-05-28 — додано дві локації (Шлюб у соборі / Бенкет у
       Soprano Inn) з часами, монограма В&Ю як hero, soft vignette
       та grain для emotional impact, тонкі botanical flourishes.

       Regenerate media/og.jpg after any edit to names/date/venue:
         chromium --headless --disable-gpu --no-sandbox --hide-scrollbars \
           --default-background-color=f0e8d8ff \
           --screenshot=/tmp/og_raw.png --window-size=1200,700 \
           file://$PWD/og-card.html
         convert /tmp/og_raw.png -crop 1200x630+0+0 +repage \
                 -quality 88 -interlace plane media/og.jpg

       The .canvas div is EXACTLY 1200×630 and pinned to body (0, 0).
       Render viewport just needs to be ≥ 1200×630; we always crop the
       top-left 1200×630 region.
       ============================================================ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #f0e8d8; overflow: hidden; }
    body { width: 1200px; }

    .canvas {
      width:  1200px;
      height:  630px;
      background:
        /* Soft corner vignettes — двосторонні tinted glows, тонкий
           emotional накат від плоского bg до lit-from-center feel. */
        radial-gradient(ellipse 700px 500px at 50% 50%,
          rgba(255, 248, 226, 0.35), transparent 70%),
        radial-gradient(ellipse 500px 400px at 0% 0%,
          rgba(160, 123, 72, 0.06), transparent 60%),
        radial-gradient(ellipse 500px 400px at 100% 100%,
          rgba(160, 123, 72, 0.06), transparent 60%),
        #f0e8d8;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #2a221a;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* SVG grain — паперова текстура поверх canvas, дуже легка
       (mix-blend-mode multiply + low opacity). Дає тактильний
       luxe feel замість «digital flat». */
    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.45;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.18  0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    /* Gold corner marks — inset симетрично, тонко (1.5px). */
    .frame { position: absolute; inset: 36px; pointer-events: none; }
    .frame > span {
      position: absolute;
      width: 44px; height: 44px;
      border: 1.5px solid #a07b48;
    }
    .frame > .tl { top: 0;    left:  0; border-right: 0; border-bottom: 0; }
    .frame > .tr { top: 0;    right: 0; border-left:  0; border-bottom: 0; }
    .frame > .bl { bottom: 0; left:  0; border-right: 0; border-top:    0; }
    .frame > .br { bottom: 0; right: 0; border-left:  0; border-top:    0; }

    .card {
      text-align: center;
      max-width: 1080px;
      padding: 0 60px;
      position: relative;
      z-index: 2;
    }

    /* —— Eyebrow ——————————————————————————————— */
    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: #8a7c69;
      margin-bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 18px;
    }
    .eyebrow::before,
    .eyebrow::after {
      content: '';
      width: 36px;
      height: 1px;
      background: #a07b48;
      opacity: 0.6;
    }

    /* —— Names (hero) ————————————————————————— */
    .names {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 112px;
      line-height: 1.0;
      letter-spacing: -0.01em;
      color: #2a221a;
      margin: 8px 0 14px;
      white-space: nowrap;
    }
    .names .amp {
      font-family: 'Italiana', 'Times New Roman', serif;
      font-style: normal;
      color: #a07b48;
      font-size: 1.18em;
      padding: 0 0.08em;
      vertical-align: -0.04em;
    }

    /* —— Date pill ——————————————————————————— */
    .date {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 28px;
      letter-spacing: 0.12em;
      color: #4a3d2a;
      margin-bottom: 22px;
      font-variant-numeric: lining-nums tabular-nums;
    }
    .date .day { font-weight: 500; }
    .date .dot { color: #a07b48; padding: 0 0.4em; }

    /* —— Flourish divider ——————————————————— */
    .flourish {
      display: block;
      margin: 0 auto 22px;
      color: #a07b48;
    }
    .flourish path  { fill: none; stroke: currentColor; stroke-width: 1; }
    .flourish .leaf { fill: currentColor; stroke: none; }
    .flourish .pearl {
      fill: #f0e8d8;
      stroke: currentColor;
      stroke-width: 1;
    }

    /* —— Schedule (two lines) ——————————————— */
    .schedule {
      display: grid;
      gap: 10px;
      max-width: 720px;
      margin: 0 auto 22px;
    }
    .sched-row {
      display: grid;
      grid-template-columns: auto auto 1fr;
      align-items: baseline;
      gap: 16px;
      text-align: left;
    }
    .sched-time {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #a07b48;
      font-variant-numeric: lining-nums tabular-nums;
    }
    .sched-stage {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #8a7c69;
      padding-right: 4px;
      border-right: 1px solid rgba(160, 123, 72, 0.4);
    }
    .sched-venue {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 26px;
      color: #2a221a;
      padding-left: 4px;
    }

    /* —— Footer city ——————————————————————— */
    .city {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 12px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: #8a7c69;
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }
    .city .pip {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #a07b48;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="canvas">

    <div class="grain" aria-hidden="true"></div>

    <div class="frame">
      <span class="tl"></span><span class="tr"></span>
      <span class="bl"></span><span class="br"></span>
    </div>

    <div class="card">
      <p class="eyebrow">Запрошуємо на наше весілля</p>

      <h1 class="names">
        Володимир<span class="amp">&amp;</span>Юстина
      </h1>

      <p class="date">
        <span class="day">17</span><span class="dot">·</span>липня<span class="dot">·</span><span class="day">2026</span>
      </p>

      <svg class="flourish" width="260" height="20" viewBox="0 0 260 20" aria-hidden="true">
        <path d="M4 10 C 50 10, 80 4, 110 10 Q 122 12, 130 10 Q 138 8, 150 10 C 180 16, 210 10, 256 10"/>
        <circle class="pearl" cx="130" cy="10" r="3"/>
        <path class="leaf" d="M88 6 Q 90 1 96 3 Q 94 8 88 6 Z" opacity="0.7"/>
        <path class="leaf" d="M172 14 Q 170 19 164 17 Q 166 12 172 14 Z" opacity="0.7"/>
      </svg>

      <div class="schedule">
        <div class="sched-row">
          <span class="sched-time">13:00</span>
          <span class="sched-stage">Шлюб</span>
          <span class="sched-venue">Домініканський собор</span>
        </div>
        <div class="sched-row">
          <span class="sched-time">16:00</span>
          <span class="sched-stage">Бенкет</span>
          <span class="sched-venue">Soprano Inn</span>
        </div>
      </div>

      <p class="city">
        <span class="pip"></span>
        Львів · Україна
        <span class="pip"></span>
      </p>
    </div>
  </div>
</body>
</html>
