<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Володимир та Юстина · 17.07.2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap">

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/sections.css">
</head>
<body>
  <section id="hero" class="hero">
    <!-- Ambient floating particles. Positions and delays inline so we don't bloat CSS. -->
    <span class="particle" style="left:8%;  animation-delay:0.3s"></span>
    <span class="particle" style="left:18%; animation-delay:1.9s"></span>
    <span class="particle" style="left:28%; animation-delay:3.0s"></span>
    <span class="particle" style="left:42%; animation-delay:0.9s"></span>
    <span class="particle" style="left:55%; animation-delay:2.6s"></span>
    <span class="particle" style="left:68%; animation-delay:1.2s"></span>
    <span class="particle" style="left:78%; animation-delay:4.0s"></span>
    <span class="particle" style="left:88%; animation-delay:2.1s"></span>

    <div class="hero-inner">
      <p class="eyebrow">дорогі наші рідні</p>

      <div class="hearts" aria-hidden="true">
        <span>♡</span><span>♥</span><span>♡</span><span>♥</span><span>♡</span>
      </div>

      <h1 class="name shimmer" id="hero-name-1" data-text="ВОЛОДИМИР">ВОЛОДИМИР</h1>
      <p class="amp"><span>та</span></p>
      <h1 class="name shimmer" id="hero-name-2" data-text="ЮСТИНА">ЮСТИНА</h1>

      <div class="rings" aria-hidden="true">
        <svg viewBox="0 0 80 40" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ringGold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"   stop-color="#fff5cc"/>
              <stop offset="55%"  stop-color="#e2b65c"/>
              <stop offset="100%" stop-color="#7a4f15"/>
            </linearGradient>
          </defs>
          <circle cx="30" cy="20" r="14" fill="none" stroke="url(#ringGold)" stroke-width="2.2"/>
          <circle cx="50" cy="20" r="14" fill="none" stroke="url(#ringGold)" stroke-width="2.2"/>
        </svg>
      </div>

      <p class="date">17 · 07 · 2026</p>
    </div>

    <div class="scroll-hint" aria-hidden="true">↓ scroll</div>
  </section>

  <!-- §2 Personalized greeting (Stage 3 placeholder; Stage 7 interpolates guest name) -->
  <section id="greeting" class="section reveal">
    <div class="section__inner">
      <p class="section__eyebrow">привітання</p>
      <p class="section__lead">
        <span class="greeting__name">Дорогі друзі</span>,
        ми надзвичайно раді запросити саме вас стати частиною нашого свята.
      </p>
      <div class="divider" aria-hidden="true"></div>
    </div>
  </section>

  <!-- §3 Story (payload-verbatim) -->
  <section id="story" class="section reveal">
    <div class="section__inner">
      <div class="story__heart" aria-hidden="true">♥</div>
      <p class="section__lead">
        Запрошуємо вас стати частиною нашої історії кохання
        та розділити з нами день народження нашої сімʼї.
      </p>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
