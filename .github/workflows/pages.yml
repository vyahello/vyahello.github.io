name: Deploy to GitHub Pages

# Replaces the legacy branch-source Pages builder, which silently stalled
# 2026-05-26 and never created deployments for new commits. Actions-based
# Pages uses healthy infrastructure and surfaces real build logs on failure.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-flight deployment when a newer push arrives — let it
# finish so the queue stays consistent. Newer push will deploy right after.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Uploads the whole repo as-is (no Jekyll, no build step) — static
      # HTML/CSS/JS portfolio with v-y/, penni/, etc. subprojects.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
